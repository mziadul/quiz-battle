services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiz_fight
    restart: unless-stopped
    volumes:
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=${REVERB_PORT:-8080}
    ports:
      - "${REVERB_PORT:-8080}:${REVERB_PORT:-8080}"
    volumes:
      - .:/var/www
    depends_on:
      - app
    networks:
      - app-network

  vite-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_vite_dev
    profiles: ["dev"]
    command: npm run dev -- --host 0.0.0.0 --port 5175
    ports:
      - "5175:5175"
    volumes:
      - .:/var/www
    networks:
      - app-network

  vite-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_vite_prod
    profiles: ["prod"]
    command: sh -c "rm -f public/hot && npm run build"
    volumes:
      - .:/var/www
    networks:
      - app-network

networks:
  app-network:
    driver: bridge